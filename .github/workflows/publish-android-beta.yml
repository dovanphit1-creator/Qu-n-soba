name: Publish tested Android beta APK
on:
  workflow_dispatch:
  push:
    branches: [android-native]
    paths: ['.github/workflows/publish-android-beta.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-android-beta
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TESTED_REF: 'android-beta4-verified'
      TESTED_RUN: '36945190992'
      TESTED_COMMIT: 'd4a2c9ee023abb11a66037363943619879d562b9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Require successful device tests for exact Android source
        run: |
          gh api "repos/$GH_REPO/git/ref/heads/$TESTED_REF" | jq -e --arg sha "$TESTED_COMMIT" '.object.sha == $sha'
          gh run watch "$TESTED_RUN" --exit-status
          gh api "repos/$GH_REPO/actions/runs/$TESTED_RUN" | jq -e --arg sha "$TESTED_COMMIT" '.head_sha == $sha and .conclusion == "success" and .head_branch == "android-native"'
          gh run download "$TESTED_RUN" --name QuanMiCuaToi-Android-1.8.0-beta.4 --dir tested
      - name: Apply public signature patch and verify identical game payload
        run: |
          pip install bsdiff4==1.2.6
          python3 - <<'VERIFY'
          import base64, bsdiff4, hashlib, io, zipfile
          from pathlib import Path
          original=Path('tested/QuanMiCuaToi-Android-1.8.0-beta.4.apk').read_bytes()
          assert hashlib.sha256(original).hexdigest()=='f949a1206a3c42e00ca47aceb0b188b4c90d677d19ffb6185c03429d92298a85'
          patch=base64.b64decode(Path('.github/release-artifacts/android-beta4-signature.bsdiff.b64').read_text())
          data=bsdiff4.patch(original,patch)
          assert len(data)==24119462
          assert hashlib.sha256(data).hexdigest()=='57746fffc4a505966e8fb2c1f336418e1b230c58fb8c539102901895c8a99ab7'
          with zipfile.ZipFile(io.BytesIO(original)) as a,zipfile.ZipFile(io.BytesIO(data)) as b:
              assert {n:a.read(n) for n in a.namelist() if not n.startswith('META-INF/')}=={n:b.read(n) for n in b.namelist() if not n.startswith('META-INF/')}
          Path('apk').mkdir(exist_ok=True)
          Path('apk/QuanMiCuaToi-Android-1.8.0-beta.4.apk').write_bytes(data)
          Path('apk/SHA256SUMS.txt').write_text('57746fffc4a505966e8fb2c1f336418e1b230c58fb8c539102901895c8a99ab7  QuanMiCuaToi-Android-1.8.0-beta.4.apk\n')
          print('PASS: stable-signed APK has exactly the tested game payload')
          VERIFY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs apk/QuanMiCuaToi-Android-1.8.0-beta.4.apk > cert.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 0dd468be6fcebbd06d46546248df067343f3e04f430b22382953d2813d7de4c9' cert.txt
      - name: Publish compatible Android channel without replacing Windows latest
        run: |
          cat > notes.md <<'MD'
          **Quán Mì Của Tôi — Android 1.8.0-beta.4**, nhà phát hành **Đỗ Văn Phi**.

          Màn hình tải mới là tranh một quán mì ấm áp, dùng chung với bản web và Windows. Hiện trong khi khởi động và tự biến mất sau khung hình đầu tiên. Gameplay Python 1.7.4. Giữ tên game, icon bát mì, dữ liệu lưu và tự thông báo khi có APK mới.

          Dùng cùng khóa ký cố định với beta.3: có thể cài đè beta.4 lên beta.3 để giữ tiến trình. Beta.1 và beta.2 dùng khóa tạm khác nên không thể cài đè; không gỡ ứng dụng nếu chưa sao lưu.

          Android 8.0 trở lên, Android System WebView cập nhật. APK cài trực tiếp, chưa phải Google Play. Runtime và game đóng gói để chơi offline; tiến trình lưu trên máy. Android có thể dừng ứng dụng nền.

          Đã đạt 4 kiểm tra trên Android 36: thao tác cảm ứng, lưu/khôi phục, tiếng Việt/emoji, thông báo cập nhật và lỗi mất mạng. Đã xác minh ảnh chung, chữ ký và toàn bộ payload giống chính xác APK được kiểm tra. Khóa riêng không đưa lên repo.

          [android-apk-channel:androidbeta]
          MD
          gh release create android-1.8.0-beta.4 apk/QuanMiCuaToi-Android-1.8.0-beta.4.apk apk/SHA256SUMS.txt --target "$TESTED_REF" --prerelease --latest=false --title 'Quán Mì Của Tôi — Android 1.8.0-beta.4' --notes-file notes.md
      - name: Prepare verified APK Git blob for the same-origin website download
        run: |
          python3 - <<'BLOB'
          import base64, json, os, urllib.request, hashlib
          from pathlib import Path
          data=Path('apk/QuanMiCuaToi-Android-1.8.0-beta.4.apk').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='57746fffc4a505966e8fb2c1f336418e1b230c58fb8c539102901895c8a99ab7'
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GH_REPO']+'/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=120) as response:blob=json.load(response)
          print('VERIFIED_ANDROID_BLOB='+blob['sha'])
          BLOB

name: Build and verify Windows game

on:
  pull_request:
  push:
    branches: [main, build-windows-app, update-1.2.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install pyinstaller pygame-ce==2.5.7 holidays==0.105 pillow==11.3.0 pystray==0.19.5
      - name: Build permanent noodle bowl icon
        run: python soba_manual/build_brand_assets.py
      - name: Check service cycle and gameplay rules
        run: python -m unittest discover -s soba_manual -p "test*.py"
      - name: Build standalone graphical application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Quán Mì Của Tôi" --icon soba_manual/assets/game.ico --version-file soba_manual/assets/version.txt --add-data "soba_manual/assets;assets" --paths soba_manual --collect-all holidays soba_manual/main.py
      - name: Run the actual Windows executable through a service cycle
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'smoke-windows.json'
          $process = Start-Process -FilePath '.\dist\Quán Mì Của Tôi.exe' -ArgumentList @('--smoke-test', $report) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Executable test failed: $($process.ExitCode)" }
          python -c "import pefile; p=pefile.PE('dist/Quán Mì Của Tôi.exe'); ids={e.id for e in p.DIRECTORY_ENTRY_RESOURCE.entries}; assert {3,14} <= ids"
          if ($LASTEXITCODE -ne 0) { throw 'Missing Windows icon resources' }
          $info = (Get-Item '.\dist\Quán Mì Của Tôi.exe').VersionInfo
          if ($info.ProductName -ne 'Quán Mì Của Tôi') { throw 'Incorrect permanent product name' }
          if ($info.ProductVersion -ne '1.2.0') { throw 'Incorrect release version' }
          if ($info.CompanyName -ne 'Đỗ Văn Phi') { throw 'Incorrect publisher credit' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen -or $result.platform -ne 'win32') { throw 'Invalid executable verification report' }
          $fresh = Join-Path $PWD 'new-player.json'
          $process = Start-Process -FilePath '.\dist\Quán Mì Của Tôi.exe' -ArgumentList @('--verify-new-player', $fresh) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'New player verification failed' }
          $newPlayer = Get-Content $fresh -Raw | ConvertFrom-Json
          if (-not $newPlayer.ok -or -not $newPlayer.frozen) { throw 'Invalid new player report' }
          $signature = Get-AuthenticodeSignature '.\dist\Quán Mì Của Tôi.exe'
          Write-Output ('Authenticode status: ' + $signature.Status)
          Copy-Item 'soba_manual\HUONG_DAN.txt' 'dist\HUONG_DAN.txt'
          Copy-Item 'soba_manual\PHAT_HANH.txt' 'dist\PHAT_HANH.txt'
          $hash = (Get-FileHash '.\dist\Quán Mì Của Tôi.exe' -Algorithm SHA256).Hash
          Set-Content -Path 'dist\SHA256.txt' -Encoding utf8 -Value ($hash + '  Quán Mì Của Tôi.exe')
          $unexpected = Get-ChildItem dist -File | Where-Object { $_.Name -notin @('Quán Mì Của Tôi.exe','HUONG_DAN.txt','PHAT_HANH.txt','SHA256.txt') }
          if ($unexpected) { throw 'Unexpected files in release folder' }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          $version = python -c "import sys; sys.path.insert(0,'soba_manual'); from brand import GAME_VERSION; print(GAME_VERSION)"
          & $compiler "/DGameVersion=$version" 'soba_manual\installer\game.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify install, reinstall and uninstall preserve player saves
        shell: pwsh
        run: ./soba_manual/installer/verify-install.ps1
      - name: Verify update while released old game is running
        shell: pwsh
        run: ./soba_manual/installer/verify-live-upgrade.ps1
      - name: Upload standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: QuanMiCuaToi-Setup
          path: installer-output/QuanMiCuaToi-Setup.exe
          if-no-files-found: error
      - name: Upload ready-to-play Windows app
        uses: actions/upload-artifact@v4
        with:
          name: QuanMiCuaToi-Windows
          path: |
            dist/Quán Mì Của Tôi.exe
            dist/HUONG_DAN.txt
            dist/PHAT_HANH.txt
            dist/SHA256.txt
          if-no-files-found: error
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: Windows-verification
          path: |
            staff-preview.png
            background-preview.png
            background-verification.json
            live-upgrade-verification.json
            installer-verification.json
            new-player.json
            new-player.png
            smoke-windows.json
            smoke-windows.png
            expansion-preview.png
            supplier-preview.png
            menu-preview.png
            shared-preview.png
          if-no-files-found: error

      - name: Publish verified 1.2.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/update-1.2.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash 'installer-output/QuanMiCuaToi-Setup.exe' -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding utf8 -Path 'installer-output/SHA256.txt' -Value ($hash + '  QuanMiCuaToi-Setup.exe')
          gh release create '1.2.0' 'installer-output/QuanMiCuaToi-Setup.exe' 'installer-output/SHA256.txt' --target '${{ github.sha }}' --title 'Quán Mì Của Tôi 1.2.0' --notes-file 'soba_manual/RELEASE_NOTES_1.2.0.md' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

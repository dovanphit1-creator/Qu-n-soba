name: Verify public Windows download
on:
  push:
    paths: ['docs/index.html', '.github/workflows/verify-download.yml']
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check published buttons and installer bytes
        run: |
          python3 - <<'PY'
          import hashlib, time, urllib.request, json, sys, types
          root='https://dovanphit1-creator.github.io/Qu-n-soba/'
          path='downloads/1.7.3/QuanMiCuaToi-Setup.exe'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(root+'?verify='+str(time.time()),timeout=20) as r:
                      page=r.read().decode()
                  assert page.count('href="'+path+'" download="QuanMiCuaToi-Setup.exe"')==2
                  with urllib.request.urlopen(root+path,timeout=90) as r:
                      assert r.status==200
                      data=r.read()
                  assert len(data)==28999830
                  assert hashlib.sha256(data).hexdigest()=='eca6e5da1105f19503eda8deaf75933e39da8ea3fd7f675b229da2ad6037975f'
                  print('PASS: two Windows same-origin download buttons; installer HTTP 200; exact release 1.7.3 SHA256.')
                  apk_path='downloads/android/1.8.0-beta.3/QuanMiCuaToi-Android-1.8.0-beta.3.apk'
                  assert page.count('href="'+apk_path+'" download="QuanMiCuaToi-Android-1.8.0-beta.3.apk"')==2
                  with urllib.request.urlopen(root+apk_path,timeout=90) as r:
                      assert r.status==200
                      apk=r.read()
                  assert len(apk)==23222287
                  assert hashlib.sha256(apk).hexdigest()=='ee32ef315a3bc35518b708d38113f1766b40059f0f3bdf27b6f5b69a52b4ef44'
                  print('PASS: two same-origin Android buttons; APK HTTP 200; exact stable-signed beta 3 SHA256.')

                  with urllib.request.urlopen('https://api.github.com/repos/dovanphit1-creator/Qu-n-soba/releases/latest',timeout=20) as r:
                      release=json.load(r)
                  assert release['tag_name']=='1.7.3' and not release['prerelease']
                  with urllib.request.urlopen('https://raw.githubusercontent.com/dovanphit1-creator/Qu-n-soba/8a4594d8d097cc332b1640d3e62a037277e80d72/soba_manual/updates.py',timeout=20) as r:
                      updater=r.read().decode()
                  brand=types.ModuleType('brand');brand.GAME_VERSION='1.0.0';sys.modules['brand']=brand
                  namespace={};exec(compile(updater,'updates.py','exec'),namespace)
                  notification=namespace['release_update'](release)
                  assert notification and notification['version']=='1.7.3' and 'ván lưu' in notification['notes']
                  assert namespace['release_update'](release,'1.7.2') and namespace['release_update'](release,'1.7.3') is None
                  print('PASS: original 1.0.0 updater recognizes live 1.7.3 release and displays its notes.')
                  break
              except Exception as error:
                  if attempt==29:raise
                  print('Waiting for Pages publication:',type(error).__name__,flush=True)
                  time.sleep(10)
          PY

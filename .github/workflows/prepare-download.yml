name: Prepare verified Windows download
on:
  push:
    paths: ['.github/workflows/prepare-download.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Verify 1.3.2 installer and store its Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          url='https://github.com/dovanphit1-creator/Qu-n-soba/releases/download/1.3.2/QuanMiCuaToi-Setup.exe'
          with urllib.request.urlopen(url,timeout=90) as r:
              data=r.read()
          assert len(data)==27586730
          assert data[:2]==b'MZ'
          assert hashlib.sha256(data).hexdigest()=='198b46d6f46c66c8117bbb90c30a30978b89200202734a04a1fccaf52b96b58b'
          request=urllib.request.Request(
              'https://api.github.com/repos/dovanphit1-creator/Qu-n-soba/git/blobs',
              data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode('ascii')}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(request,timeout=120) as r:
              blob=json.load(r)
          print('VERIFIED_INSTALLER_BLOB='+blob['sha'])
          print('Verified release 1.3.2 installer: 27586730 bytes, SHA256 matches.')
          PY

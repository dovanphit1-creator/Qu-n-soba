<style>
#boot-status{position:fixed;inset:0;z-index:1000000;background:#26372e;color:#fff2d2;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;padding:24px;pointer-events:none}#boot-status[hidden]{display:none}#boot-card{max-width:620px;width:100%;text-align:center;background:#314b3a;border:1px solid #63785d;border-radius:16px;padding:32px;pointer-events:auto}#boot-card h1{font-size:28px;margin-top:0}#boot-card p{line-height:1.6}#boot-card a,#boot-card button{display:inline-block;background:#f4ba53;color:#26372e;padding:12px 18px;border:0;border-radius:6px;margin:6px;font-size:14px;font-weight:bold;text-decoration:none;cursor:pointer}#boot-detail{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;text-align:left;font-size:12px}#boot-retry{display:none}#boot-card .small{font-size:13px;color:#d5dfca}
</style>
<div id="boot-status" role="status" aria-live="polite"><div id="boot-card"><h1>Quán Mì của tôi</h1><p id="boot-message">Đang tải game. Lần đầu mở có thể mất một chút thời gian.</p><p class="small">Bản web không lưu. Tải lại hoặc đóng trang là chơi từ đầu.</p><button id="boot-start" type="button">Bấm để bắt đầu</button><button id="boot-retry" type="button">Tải lại game</button><a href="https://github.com/dovanphit1-creator/Qu-n-soba/releases/download/1.0.0/Quan.Mi.c.a.toi.exe">Tải bản Windows</a><pre id="boot-detail" hidden></pre></div></div>
<script>
(()=>{
 const overlay=document.getElementById('boot-status'),msg=document.getElementById('boot-message'),retry=document.getElementById('boot-retry'),start=document.getElementById('boot-start'),detail=document.getElementById('boot-detail');let ready=false,failed=false;
 window.sobaStatus=(state,text='')=>{if(state==='ready'){ready=true;overlay.hidden=true;return}if(state==='error'){failed=true;overlay.hidden=false;msg.textContent='Không khởi động được game. Bạn có thể tải lại hoặc gửi phần lỗi bên dưới để mình kiểm tra.';detail.hidden=false;detail.textContent=text;retry.style.display='inline-block';start.hidden=true;return}if(state==='stopped'){overlay.hidden=false;msg.textContent=text;retry.style.display='inline-block';start.hidden=true;return}if(!failed)msg.textContent=text||'Đang tải game…';};
 start.onclick=()=>{msg.textContent='Đang chuẩn bị quán…';if(window.MM)window.MM.UME=true;window.focus();};
 retry.onclick=()=>location.reload();
 window.addEventListener('error',e=>{if(ready)return;const target=e.target;if(target&&target.tagName==='SCRIPT')window.sobaStatus('error','Không tải được thành phần: '+target.src);else if(e.message)window.sobaStatus('error',e.message);},true);
 window.addEventListener('unhandledrejection',e=>{if(!ready)window.sobaStatus('error',String(e.reason));});
 setTimeout(()=>{if(!ready&&!failed){msg.textContent='Game vẫn đang tải. Nếu chờ lâu, hãy bấm tải lại và kiểm tra kết nối mạng.';retry.style.display='inline-block';}},45000);
})();
</script>

<style>
#boot-status{position:fixed;inset:0;z-index:1000000;display:flex;align-items:center;box-sizing:border-box;padding:clamp(24px,5vw,76px);background:#17261f url('loading-restaurant.jpg') center/cover no-repeat;color:#fff4df;font-family:Arial,sans-serif;isolation:isolate;overflow:auto}#boot-status[hidden]{display:none}#boot-status:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,25,19,.91),rgba(11,25,19,.67) 36%,rgba(11,25,19,.13) 76%);z-index:-1}#boot-card{width:min(540px,100%);text-align:left}#boot-logo{width:58px;height:58px;margin-bottom:22px;object-fit:contain}.boot-eyebrow{letter-spacing:.2em;font-size:11px;font-weight:700;color:#e5cda3;margin:0 0 14px}#boot-card h1{font-size:clamp(36px,5vw,68px);line-height:1.08;letter-spacing:-.035em;margin:0 0 16px;max-width:520px}#boot-card .boot-tagline{font-size:clamp(15px,1.8vw,21px);line-height:1.6;color:#f0dcc0;margin:0 0 32px}#boot-message{font-size:16px;line-height:1.5;margin:14px 0 0;min-height:2em}#boot-track{height:3px;width:min(340px,100%);background:#ffffff2b;overflow:hidden;border-radius:3px}#boot-track:after{content:'';display:block;width:35%;height:100%;background:#e9b879;animation:boot-load 1.6s ease-in-out infinite}#boot-start,#boot-retry{background:#f4d49e;color:#193127;border:1px solid #f4d49e;border-radius:6px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer;margin:16px 10px 0 0;min-height:46px}#boot-start:disabled{opacity:.65;cursor:default}#boot-retry{background:transparent;color:#fff4df}#boot-retry[hidden],#boot-start[hidden]{display:none}#boot-card .small{font-size:12px;line-height:1.6;color:#d1c7b5;margin:22px 0 0;max-width:410px}.boot-credit{font-size:11px!important;opacity:.74;margin-top:12px!important}#boot-detail{white-space:pre-wrap;overflow-wrap:anywhere;max-height:100px;overflow:auto;font:11px monospace;color:#efd5bd;padding:12px;background:#0006}#boot-detail[hidden]{display:none}@keyframes boot-load{from{transform:translateX(-100%)}to{transform:translateX(390%)}}@media(max-width:600px){#boot-status{align-items:flex-end;padding:30px 24px}#boot-status:before{background:linear-gradient(0deg,rgba(11,25,19,.97),rgba(11,25,19,.8) 48%,rgba(11,25,19,.18))}#boot-logo{width:42px;height:42px;margin-bottom:14px}#boot-card .boot-tagline{margin-bottom:24px}}@media(max-height:500px){#boot-status{padding:20px 32px;align-items:center}#boot-logo{display:none}#boot-card h1{font-size:34px}.boot-eyebrow{margin-bottom:9px}#boot-card .boot-tagline{font-size:14px;margin-bottom:16px}#boot-message{font-size:13px}#boot-start,#boot-retry{padding:9px 18px;min-height:38px;margin-top:10px}#boot-card .small{font-size:10px;margin-top:12px}}@media(prefers-reduced-motion:reduce){#boot-track:after{animation:none;width:100%}}
</style>
<div id="boot-status" role="status" aria-live="polite"><div id="boot-card"><img id="boot-logo" src="game-icon.png" width="58" height="58" alt=""><p class="boot-eyebrow">MỜI BẠN GHÉ QUÁN</p><h1>Quán Mì<br>Của Tôi</h1><p class="boot-tagline">Một quán nhỏ. Từng bát mì.<br>Câu chuyện của bạn.</p><div id="boot-track" role="progressbar" aria-label="Đang chuẩn bị game"></div><p id="boot-message">Đang tải dữ liệu quán mì…</p><button id="boot-start" type="button">Vào quán</button><button id="boot-retry" type="button" hidden>Tải lại game</button><p class="small" id="boot-edition">Bản web không lưu. Tải lại hoặc đóng trang là chơi từ đầu.</p><p class="small boot-credit">Phiên bản __LOADING_VERSION__ · Nhà phát hành Đỗ Văn Phi</p><pre id="boot-detail" hidden></pre></div></div>
<script>
(()=>{
 const overlay=document.getElementById('boot-status'),msg=document.getElementById('boot-message'),retry=document.getElementById('boot-retry'),start=document.getElementById('boot-start'),detail=document.getElementById('boot-detail');let ready=false,failed=false;window.sobaStartRequested=false;
 window.sobaStatus=(state,text='')=>{if(state==='ready'){ready=true;overlay.hidden=true;window.dispatchEvent(new CustomEvent('soba-game-ready'));return}if(state==='error'){failed=true;overlay.hidden=false;msg.textContent='Chưa mở được quán. Hãy thử tải lại game.';detail.hidden=false;detail.textContent=text;retry.hidden=false;start.hidden=true;return}if(state==='stopped'){overlay.hidden=false;msg.textContent=text;retry.hidden=false;start.hidden=true;return}if(!failed)msg.textContent=text||'Đang chuẩn bị quán…';};
 start.onclick=()=>{window.sobaStartRequested=true;msg.textContent='Đang chuẩn bị quán…';start.textContent='Đang mở quán…';window.focus();};
 retry.onclick=()=>location.reload();
 window.addEventListener('error',e=>{if(ready)return;const target=e.target;if(target&&target.tagName==='SCRIPT')window.sobaStatus('error','Không tải được thành phần: '+target.src);else if(e.message)window.sobaStatus('error',e.message);},true);
 window.addEventListener('unhandledrejection',e=>{if(!ready)window.sobaStatus('error',String(e.reason));});
 setTimeout(()=>{if(!ready&&!failed){msg.textContent='Quán vẫn đang chuẩn bị. Bạn có thể chờ thêm hoặc thử tải lại.';retry.hidden=false;}},45000);
})();
</script>

import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#26372e"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "game"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/game
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("play/game.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("play/game.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Đã sẵn sàng — bấm vào đây để chơi"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"Đang chuẩn bị game…"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    infobox.style.display = "block";

    // Measure box

    const h = infobox.offsetHeight;

    // Center in viewport
    const left = (window.innerWidth - w) / 2;
    const top = (window.innerHeight - h) / 2;

    infobox.style.top = top + "px";

<script>
(()=>{
 const overlay=document.getElementById('boot-status'),msg=document.getElementById('boot-message'),retry=document.getElementById('boot-retry'),start=document.getElementById('boot-start'),detail=document.getElementById('boot-detail');let ready=false,failed=false;
 window.sobaStatus=(state,text='')=>{if(state==='ready'){ready=true;overlay.hidden=true;return}if(state==='error'){failed=true;overlay.hidden=false;msg.textContent='Không khởi động được game. Bạn có thể tải lại hoặc gửi phần lỗi bên dưới để mình kiểm tra.';detail.hidden=false;detail.textContent=text;retry.style.display='inline-block';start.hidden=true;return}if(state==='stopped'){overlay.hidden=false;msg.textContent=text;retry.style.display='inline-block';start.hidden=true;return}if(!failed)msg.textContent=text||'Đang tải game…';};
 start.onclick=()=>{msg.textContent='Đang chuẩn bị quán…';if(window.MM)window.MM.UME=true;window.focus();};
 retry.onclick=()=>location.reload();
 window.addEventListener('error',e=>{if(ready)return;const target=e.target;if(target&&target.tagName==='SCRIPT')window.sobaStatus('error','Không tải được thành phần: '+target.src);else if(e.message)window.sobaStatus('error',e.message);},true);
 window.addEventListener('unhandledrejection',e=>{if(!ready)window.sobaStatus('error',String(e.reason));});
 setTimeout(()=>{if(!ready&&!failed){msg.textContent='Game vẫn đang tải. Nếu chờ lâu, hãy bấm tải lại và kiểm tra kết nối mạng.';retry.style.display='inline-block';}},45000);
})();
</script>
